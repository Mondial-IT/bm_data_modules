bm_config_sync.settings_form:
  path: '/admin/config/system/bm_config_sync'
  defaults:
    _title: 'ConfigSync - Configuration Synchronization Settings'
    _form: 'Drupal\bm_config_sync\Form\SettingsForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'
#
# A table with the combined entity relation diagram of a bundle
# consisting of the bundle and its children paragraphs, taxonomies
bm_config_sync.bm_config_sync_combined_erd_form:
  path: '/admin/bm_config_sync/combined-erd-form'
  defaults:
    _title: 'ERD - Combined Entity Relation Diagram table'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncCombinedERDForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'
#
bm_config_sync.bm_config_sync_erd_builder_form:
  path: '/admin/bm_config_sync/erd-builder-form'
  defaults:
    _title: 'BMConfigSyncERDBuilderForm'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncERDBuilderForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'
#
# A table with the entity relation diagram per bundle
bm_config_sync.bm_config_sync_individual_erd_form:
  path: '/admin/bm_config_sync/individual-erds'
  defaults:
    _title: 'ERD - Individual Entity Relation Diagram tables'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncIndividualERDForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'



# import Export

bm_config_sync.bm_config_sync_export_form:
  path: '/admin/config/system/bm_config_sync_export'
  defaults:
    _title: 'Export Configurations'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncExportForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'

bm_config_sync.bm_config_sync_import_form:
  path: '/admin/config/system/bm_config_sync_import'
  defaults:
    _title: 'Import Configurations'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncImportForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'

bm_config_sync.bm_config_sync_import_export_form:
  path: '/admin/config/system/bm_config_sync_import_export'
  defaults:
    _title: 'Configurations Import Export'
    _form: 'Drupal\bm_config_sync\Form\BMConfigSyncImportExportForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'

bm_config_sync.startBMConfigSyncBatchExporter:
  path: '/admin/config/system/bm_config_sync_batch_exporter'
  defaults:
    _title: 'startBMConfigSyncBatchExporter controller'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::startBMConfigSyncBatchExporter'
  requirements:
    _permission: 'administer bm_config_sync configuration'
#
#
#
bm_config_sync.bm_config_sync_uuid_form:
  path: '/admin/config/system/bm_config_sync_uuid'
  defaults:
    _title: 'UUID bm_config_sync_uuid form'
    _form: 'Drupal\bm_config_sync\Form\ConfigSyncUUIDForm'
  requirements:
    _permission: 'administer bm_config_sync configuration'
#
#

# explain available endpoints
bm_config_sync.bm_config_sync_jsonapi_endpoints:
  path: '/json-api/config/endpoints'
  defaults:
    _title: 'Return a available endpoints'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::jsonapi_endpoints'
  requirements:
    _permission: 'administer bm_config_sync configuration'
  methods: [GET]
#
# return json field list for a bundle
bm_config_sync.bm_config_sync_jsonapi_field_list:
  path: '/json-api/config/fields/{bundleName}'
  defaults:
    _title: 'Return a list of fields given a bundle'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::jsonapi_field_list'
  requirements:
    _permission: 'administer bm_config_sync configuration'
  methods: [GET]
#
# return json field list for a bundle
bm_config_sync.bm_config_sync_jsonapi_combined_erd:
  path: '/json-api/config/combined-erd/{bundleName}'
  defaults:
    _title: 'Return a table representing the combined (parent and children) ERD of a bundle'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::jsonapi_combined_erd'
  requirements:
    _permission: 'administer bm_config_sync configuration'
  methods: [GET]
#
# return json field paths for a bundle and children
bm_config_sync.bm_config_sync_jsonapi_combined_field_paths:
  path: '/json-api/config/combined-field-paths/{bundleName}'
  defaults:
    _title: 'Return only the field_paths of a combined ERD of parent and children'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::jsonapi_combined_field_paths'
  requirements:
    _permission: 'administer bm_config_sync configuration'
  methods: [GET]
#
# return json bundle list
bm_config_sync.bm_config_sync_jsonapi_bundle_list:
  path: '/json-api/config/bundles'
  defaults:
    _title: 'Return a list of bundles'
    _controller: '\Drupal\bm_config_sync\Controller\BMConfigSyncController::jsonapi_bundle_list'
  requirements:
    _permission: 'administer bm_config_sync configuration'
  methods: [GET]
#
