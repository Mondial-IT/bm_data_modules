bm_import.settings_form:
  path: '/admin/config/system/bm-import'
  defaults:
    _title: 'bm_import settings'
    _form: 'Drupal\bm_import\Form\SettingsForm'
  requirements:
    _permission: 'administer bm_import configuration'
#
bm_import.bm_importmanagement_form:
  path: '/admin/config/system/bm-import-management'
  defaults:
    _title: 'bm_import management form'
    _form: 'Drupal\bm_import\Form\BMImportManagementForm'
  requirements:
    _permission: 'administer bm_import configuration'


#
bm_import.paragraph_handler_test_form:
  path: '/admin/config/system/bm-import-test/paragraph-handler'
  defaults:
    _title: 'bm_import paragraph handler test'
    _form: 'Drupal\bm_import\BMImportHandlers\unit\BMImportParagraphHandlerTestForm'
  requirements:
    _permission: 'administer bm_import configuration'

#
bm_import.bm_import_panel_preflight_checks_form:
  path: '/admin/config/system/bm-import-preflight'
  defaults:
    _title: 'bm_import management form'
    _form: 'Drupal\bm_import\Form\Panel\Panel_preflight_checks'
  requirements:
    _permission: 'administer bm_import configuration'
