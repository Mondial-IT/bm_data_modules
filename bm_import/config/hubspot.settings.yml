#file: noinspection spellcheckinginspection
importdefinition: hubspot
csvseparator: ";"

groups:
  - todo_before_import
  - todo_with_headers
  - todo_with_columns
  - todo_after_import

# this creates fields on entities
# this creates paragraph types

todo_before_import:

  # fieldtypes
  # 'string' or 'string(200)' plain text field
  # 'text',       html field
  # 'text_long',  html field
  # 'string_long'

  # 'integer',
  # 'decimal',
  # 'float',
  # 'boolean',
  # 'date',
  # 'entity_reference',         -name, type, references, description
  # 'taxonomy_term_reference',
  # 'file',
  # 'image',
  # 'email',
  # 'link',
  # 'list_string',
  # 'list_integer',
  # 'list_float',
  # 'list_boolean',
  # 'list_text',
  # 'datetime',
  # 'geofield',

  - name: create_node_fields
    content_type: listing
    fields:
      - name: field_listing_hubspot_id
        type: string

      - name: field_listing_hubspot_contact_id
        type: string

      - name: field_listing_hubspot_deal_id
        type: string

      - name: field_listing_hubspot_updated
        type: timestamp

todo_with_headers:
  - name: clean
    replace:
      - ':'
      - ' '
    uppercase: all

todo_with_rows:

