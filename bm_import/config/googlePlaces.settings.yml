#file: noinspection SpellCheckingInspection
importDefinition: googlePlaces
csvSeparator: "|"

groups:
  - todo_before_import
  - todo_with_headers
  - todo_with_columns
  - todo_after_import

# this creates fields on entities
# this creates paragraph types
todo_before_import:
  # note, first the last, when referencing
  - name: YMLSection_create_paragraph_type
    paragraph: place_listing_paragraph
    description: 'listing paragraph with specific google places information'

  - name: YMLSection_create_paragraph_fields
    paragraph: place_listing_paragraph
    fields:
      - name: 'field_para_place_json'
        description: 'The place details'
        # string is single line plain text
        # text_plain is multi line plain text
        # string_long is long plain text
        # text_long is Text (formatted, long)
        type: string_long
        multiple: false

      - name: 'field_para_place_review'
        description: 'Reviews'
        # Text (formatted, long)
        type: text_long
        multiple: true

      - name: 'field_para_place_nationalphonenr'
        description: 'National phonenumber'
        type: string
        multiple: true

      - name: 'field_para_place_viewprt_ne_lat'
        description: 'Viewport NorthEast Latitude'
        type: float

      - name: 'field_para_place_viewprt_ne_lng'
        description: 'Viewport NorthEast Longitude'
        type: float

      - name: 'field_para_place_viewprt_sw_lat'
        description: 'Viewport SouthWest Latitude'
        type: float

      - name: 'field_para_place_viewprt_sw_lng'
        description: 'Viewport SouthWest Longitude'
        type: float

      - name: 'field_para_place_google_maps_uri'
        description: 'Google maps uri'
        type: string

      - name: 'field_para_place_user_rating'
        description: 'user rating'
        type: string



  - name: YMLSection_create_node_type
    content_type: listing
    description: listing


  - name: YMLSection_create_node_fields
    content_type: listing
    fields:
      - name: field_listing_place_paragraph
        # entity_reference for nodes
        # entity_reference_revisions for paragraphs
        type: entity_reference_revisions
        description: 'Listing google place details'
        # must exist to not throw exception
        references: place_listing_paragraph

      - name: field_listing_housenumber
        type: string
        description: 'House number'
        label: House number

  #  - name: create_vocabulary
  #    vocabulary: financial_advisor_products
  #    description: 'de categorieen van de financial advisors'



  - name: YMLSection_create_vocabulary_type
    vocabulary: test_taxonomy
    description: 'test import created taxonomy'

  - name: YMLSection_create_vocabulary_fields
    vocabulary: test_taxonomy
    fields:
      - name: 'field_term_test'
        description: 'imported field'
        type: string
        multiple: false





todo_with_headers:
  - name: clean
    replace:
      - ':'
      - ' '
    uppercase: all

todo_with_rows:
  # this is used to find an existing entity. The more matches the better.
  locateQueries:
    # on field_listing_place_id
    # on field_listing_phone
    # on title
    # on field_listing_street
    # on field_listing_address

    - sql: SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '');
      variableKey: :TELEFOON
      csvColumn: INTERNATIONALPHONENUMBER
    #
    # SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '[^0-9]', '') = REGEXP_REPLACE(:TELEFOON, '[^0-9]', '');
    - sql: SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '');
      variableKey: :TELEFOON
      csvColumn: NATIONALPHONENUMBER
    - sql: select  nid from node_field_data where lower(title)=lower(:TITLE)
      variableKey: :TITLE
      csvColumn: TITLE
    - sql: select entity_id as nid from node__field_listing_street where field_listing_street_value=:STREET
      variableKey: :STREET
      csvColumn: ADDRESS
    - sql: select entity_id as nid from node__field_listing_address where field_listing_address_value=:ADDRESS
      variableKey: :ADDRESS
      csvColumn: ADDRESS
    # try a match on the last 9 digits of the phone number
    - sql: select entity_id as nid from node__field_listing_phone where SUBSTRING(field_listing_phone_value, -9) = SUBSTRING(:TELEFOON, -9)
      variableKey: :TELEFOON
      csvColumn: TELEFOON

