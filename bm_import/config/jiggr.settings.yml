todo_with_rows:
  # this is used to find an existing entity. The more matches the better.
  locateQueries:
    # on field_listing_place_id
    # on field_listing_phone
    # on title
    # on field_listing_street
    # on field_listing_address
    #
    # SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '[^0-9]', '') = REGEXP_REPLACE(:TELEFOON, '[^0-9]', '');

    - sql: SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '') and bundle='listing';
      variableKey: :TELEFOON
      csvColumn: TELEFOON1
      reason: TELEFOON matches phone number 1

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone p1
        WHERE REGEXP_REPLACE(p1.field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '')
          AND p1.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON2
      reason: TELEFOON matches phone number 2

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone2 p2
        WHERE REGEXP_REPLACE(p2.field_listing_phone2_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '')
          AND p2.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON3
      reason: TELEFOON matches phone number 3

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone3 p3
        WHERE REGEXP_REPLACE(p3.field_listing_phone3_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '')
          AND p3.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON4
      reason: TELEFOON matches phone number 3

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone4 p4
        WHERE REGEXP_REPLACE(p4.field_listing_phone4_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '')
          AND p4.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON
      reason: TELEFOON matches field_listing_phone3


# bedrijfsnaam
    - sql: select  nid from node_field_data where lower(title)=lower(:TITLE) and type='listing'
      variableKey: :TITLE
      csvColumn: BEDRIJFSNAAM
      reason: BEDRIJFSNAAM matches title
# kvk
    - sql: select entity_id as nid from node__field_listing_coc_no where field_listing_coc_no_value=:KVK  and bundle='listing'
      variableKey: :KVK
      csvColumn: KVK
      reason: KVK matches coc_no_value
# adres
    - sql: select entity_id as nid from node__field_listing_street where field_listing_street_value=:STREET  and bundle='listing'
      variableKey: :STREET
      csvColumn: ADRES
      reason: ADRES matches street_value

    - sql: select entity_id as nid from node__field_listing_address where field_listing_address_value=:ADDRESS  and bundle='listing'
      variableKey: :ADDRESS
      csvColumn: ADRES
      reason: ADRES matches address_value
#
    # try a match on the last 9 digits of the phone number
    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone p1
        WHERE SUBSTRING(p1.field_listing_phone_value, -9) = SUBSTRING(:TELEFOON, -9)
          AND p1.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON1
      reason: last 9 digits of TELEFOON matches field_listing_phone

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone p2
        WHERE SUBSTRING(p2.field_listing_phone_value, -9) = SUBSTRING(:TELEFOON, -9)
          AND p2.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON2
      reason: last 9 digits of TELEFOON matches field_listing_phone

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone2 p3
        WHERE SUBSTRING(p3.field_listing_phone2_value, -9) = SUBSTRING(:TELEFOON, -9)
          AND p3.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON3
      reason: last 9 digits of TELEFOON matches field_listing_phone2

    - sql: |
        SELECT entity_id AS nid
        FROM node__field_listing_phone3 p4
        WHERE SUBSTRING(p4.field_listing_phone3_value, -9) = SUBSTRING(:TELEFOON, -9)
          AND p4.bundle = 'listing'
      variableKey: :TELEFOON
      csvColumn: TELEFOON4
      reason: last 9 digits of TELEFOON matches field_listing_phone3

