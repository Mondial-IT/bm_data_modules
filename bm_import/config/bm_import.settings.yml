todo_with_rows:
  # this is used to find an existing entity in the inspector featur.
  # The more matches the better.
  locateQueries:
    # on field_listing_place_id
    # on field_listing_phone
    # on title
    # on field_listing_street
    # on field_listing_address

    - sql: SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '');
      variableKey: :TELEFOON
      csvColumn: TELEFOON
    #
    # SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '[^0-9]', '') = REGEXP_REPLACE(:TELEFOON, '[^0-9]', '');
    - sql: SELECT entity_id AS nid FROM node__field_listing_phone WHERE REGEXP_REPLACE(field_listing_phone_value, '\\D', '') = REGEXP_REPLACE(:TELEFOON, '\\D', '');
      variableKey: :TELEFOON
      csvColumn: TELEFOON

    - sql: select  nid from node_field_data where lower(title)=lower(:TITLE)
      variableKey: :TITLE
      excelColumn: BEDRIJFSNAAM
      reason: BEDRIJFSNAAM matches title

    # kvk
    - sql: select entity_id as nid from node__field_listing_coc_no where field_listing_coc_no_value=:KVK  and bundle='listing'
      variableKey: :KVK
      excelColumn: KVK
      reason: KVK matches coc_no_value

    # adres
    - sql: select entity_id as nid from node__field_listing_street where field_listing_street_value=:STREET  and bundle='listing'
      variableKey: :STREET
      excelColumn: ADRES
      reason: ADRES matches street_value

    - sql: select entity_id as nid from node__field_listing_address where field_listing_address_value=:ADDRESS  and bundle='listing'
      variableKey: :ADDRESS
      excelColumn: ADRES
      reason: ADRES matches address_value
    #
    # try a match on the last 9 digits of the phone number
    - sql: |
        SELECT p1.entity_id AS nid
        FROM node__field_listing_phone p1
        left join node__field_listing_phone2 p2 on p2.entity_id = p1.entity_id
        left join node__field_listing_phone3 p3 on p3.entity_id = p1.entity_id
        left join node__field_listing_phone4 p4 on p4.entity_id = p1.entity_id

        WHERE SUBSTRING(p1.field_listing_phone_value, -9) = concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p2.field_listing_phone2_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p3.field_listing_phone3_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p4.field_listing_phone4_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
          AND p1.bundle = 'listing'
      variableKey: :TELEFOON
      excelColumn: TELEFOON
      reason: last 9 digits of TELEFOON matches field_listing_phone, 1, 2 or 3

    # try a match on the last 9 digits of the TELEFOON2 nr
    - sql: |
        SELECT p1.entity_id AS nid
        FROM node__field_listing_phone p1
        left join node__field_listing_phone2 p2 on p2.entity_id = p1.entity_id
        left join node__field_listing_phone3 p3 on p3.entity_id = p1.entity_id
        left join node__field_listing_phone4 p4 on p4.entity_id = p1.entity_id

        WHERE SUBSTRING(p1.field_listing_phone_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p2.field_listing_phone2_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p3.field_listing_phone3_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
        OR SUBSTRING(p4.field_listing_phone4_value, -9) =  concat("987654321",SUBSTRING(:TELEFOON, -9))
          AND p1.bundle = 'listing'
      variableKey: :TELEFOON
      excelColumn: TELEFOON2
      reason: last 9 digits of TELEFOON2 matches field_listing_phone, 1, 2 or 3




